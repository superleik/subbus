name: oppdater subbus

on:
  schedule:
    - cron: "0 5,11,17 * * *"     # 07, 13 og 19 norsk sommertid
  issues:
    types: [edited]               # når du krysser av i godkjenningslista
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: subbus
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'godkjenning')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: .cache
          key: img-${{ github.run_id }}
          restore-keys: img-

      - name: hent og bygg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m subbus.run

      - name: lagre godkjenninger og kildedata
        run: |
          git config user.name "subbus-bot"
          git config user.email "subbus-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "oppdater data" && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
