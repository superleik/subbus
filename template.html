<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="subbus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>subbus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
/* Light, airy sequencer-panel look: white, hairline grey grid, one green accent. Light-only by design. */
:root {
  --bg: #fff;
  --fg: #161616;
  --dim: #8a8a8a;
  --line: #d9d9d9;
  --green: #3fa34d;
  --green-soft: #eaf5ec;
  --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
  --safe: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (display-mode: standalone) { :root { --safe: calc(env(safe-area-inset-top, 0px) + 8px); } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 15px; line-height: 1.45; letter-spacing: .01em; }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: var(--safe); background: var(--bg); z-index: 4; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }
button, input { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.dim { color: var(--dim); }

header { padding-top: calc(var(--safe) + 18px); border-bottom: 1px solid var(--green); }
.bar { max-width: 40rem; margin: 0 auto; padding: 0 16px 12px; display: grid; gap: 10px; }
.logo { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.1; letter-spacing: 0; color: var(--green); white-space: pre; overflow: hidden; }
.upd { font-size: 12px; justify-self: end; }
.wrap { max-width: 40rem; margin: 0 auto; padding: 0 16px 64px; }

.nav { position: sticky; top: var(--safe); z-index: 3; background: var(--bg); display: grid; gap: 8px; padding: 14px 0 12px; border-bottom: 1px dashed var(--green); }
.nav .row { display: flex; flex-wrap: wrap; gap: 6px; }
.nav button { min-height: 32px; padding: 4px 14px; border: 1px solid var(--green); border-radius: 999px; font-size: 13px; transition: background .15s, color .15s; }
.nav button:hover { background: var(--green-soft); }
.nav button[aria-pressed="true"] { background: var(--green); color: #fff; }
.search { display: flex; align-items: center; gap: 8px; min-height: 36px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; }
.search:focus-within { border-color: var(--green); }
.search svg { flex: none; }
.search input { flex: 1; min-width: 0; font-size: 16px; outline: none; }
.search input::placeholder { color: var(--dim); }

.day { margin-top: 26px; }
.day-head { position: sticky; top: calc(var(--safe) + var(--navh, 0px)); z-index: 2; background: var(--bg); padding: 8px 0 6px; font-size: 13px; color: var(--green); border-bottom: 1px solid var(--line); }
.day-head b { font-weight: 500; color: var(--fg); margin-right: 8px; }
.ev { display: grid; grid-template-columns: 64px 5ch 1fr; column-gap: 14px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.img { width: 64px; height: 64px; border: 1px solid var(--line); background: var(--bg) center / cover no-repeat; }
.ev > div:last-child { min-width: 0; overflow-wrap: anywhere; }
.time { color: var(--green); font-size: 13px; padding-top: 2px; }
.title { font-weight: 500; }
.ev:hover .title { color: var(--green); }
.meta { color: var(--dim); font-size: 13px; }
.desc { margin-top: 8px; font-size: 14px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pill { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 14px; border: 1px solid var(--green); border-radius: 999px; font-size: 13px; text-decoration: none; }
.pill:hover { background: var(--green-soft); }
.pill.on { background: var(--green); color: #fff; }

.ongoing { margin-top: 26px; }
.ongoing h2 { margin: 0; padding: 8px 0 6px; font: inherit; font-size: 13px; color: var(--green); border-bottom: 1px solid var(--line); }
.ongoing a { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.ongoing a:hover .title { color: var(--green); }
.empty { margin-top: 26px; }
footer { margin-top: 40px; font-size: 13px; color: var(--green); display: grid; gap: 2px; justify-items: start; }
footer .pill { margin-bottom: 18px; color: var(--fg); }
</style>
</head>
<body>

<header><div class="bar"><pre class="logo" id="logo" aria-label="subbus">                        _/        _/
     _/_/_/  _/    _/  _/_/_/    _/_/_/    _/    _/    _/_/_/
  _/_/      _/    _/  _/    _/  _/    _/  _/    _/  _/_/
     _/_/  _/    _/  _/    _/  _/    _/  _/    _/      _/_/
_/_/_/      _/_/_/  _/_/_/    _/_/_/      _/_/_/  _/_/_/</pre><span class="dim upd" id="updated"></span></div></header>

<div class="wrap">
<nav class="nav" aria-label="filter">
  <div class="row" id="when"></div>
  <div class="row" id="cats"></div>
  <label class="search"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#3fa34d" stroke-width="1.3"/><path d="M9.5 9.5 13 13" stroke="#3fa34d" stroke-width="1.3"/></svg><input id="q" type="search" placeholder="søk" autocomplete="off" aria-label="søk"></label>
</nav>

<section class="ongoing" id="ongoing"></section>
<main id="feed" aria-live="polite"></main>

<footer><a class="pill" href="#">↑ til toppen</a><span>subbus</span></footer>
</div>

<script>
const DATA = /*DATA*/;
const EVENTS = DATA.events;

const WHENS = [["all","alt"],["today","i dag"],["weekend","helga"],["week","uka"]];
const CATS = ["alt","konsert","klubb","kunst","scene","film","ord","annet"];
const DAYS = ["søn","man","tir","ons","tor","fre","lør"];

const today = new Date(); today.setHours(0,0,0,0);
EVENTS.forEach((e,i) => {
  e.id = i;
  const [y,m,d] = e.date.split("-").map(Number);
  e.dt = new Date(y, m-1, d);
  e.d = Math.round((e.dt - today) / 864e5);
});

const state = { q:"", when:"all", cat:"alt", open:new Set() };
try { const s = JSON.parse(localStorage.getItem("subbus") || "{}"); if (s.when) state.when = s.when; if (CATS.includes(s.cat)) state.cat = s.cat; } catch(e) {}
const save = () => { try { localStorage.setItem("subbus", JSON.stringify({ when:state.when, cat:state.cat })); } catch(e) {} };

function chips(id, items, key) {
  const el = document.getElementById(id);
  items.forEach(it => {
    const [val, label] = Array.isArray(it) ? it : [it, it];
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.val = val; b.dataset.key = key;
    b.addEventListener("click", () => { state[key] = val; save(); render(); });
    el.appendChild(b);
  });
}
chips("when", WHENS, "when"); chips("cats", CATS, "cat");
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });

function inWhen(e) {
  if (e.d < 0) return false;
  if (state.when === "today") return e.d === 0;
  if (state.when === "week") return e.d < 7;
  if (state.when === "weekend") {
    const dow = today.getDay();
    const start = dow === 6 ? -1 : dow === 0 ? -2 : (5 - dow);
    return e.d >= Math.max(0, start) && e.d <= start + 2;
  }
  return true;
}
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Fallback picture for events without an image: a small generated colour field.
const thumb = () => "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><path d="M0 0 10 10M10 0 0 10" stroke="#3fa34d" stroke-width=".25"/></svg>');

function renderOngoing() {
  const el = document.getElementById("ongoing");
  if (!DATA.ongoing.length) return;
  el.innerHTML = `<h2>pågår</h2>` + DATA.ongoing.map(o =>
    `<a href="${esc(o.url)}" target="_blank" rel="noopener"><span class="title">${esc(o.title)}</span><br><span class="meta">${esc(o.venue)}, til ${esc(o.until)}</span></a>`).join("");
}

function render() {
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-pressed", state[b.dataset.key] === b.dataset.val));
  const list = EVENTS.filter(e =>
    (state.cat === "alt" || e.cat === state.cat) && inWhen(e) &&
    (!state.q || [e.title, e.venue, e.actor, e.desc].join(" ").toLowerCase().includes(state.q))
  );
  const feed = document.getElementById("feed");
  if (!list.length) { feed.innerHTML = '<p class="empty dim">ingenting her.</p>'; return; }

  let html = "", cur = null;
  list.forEach(e => {
    if (e.date !== cur) {
      if (cur !== null) html += "</section>";
      cur = e.date;
      const rel = e.d === 0 ? "i dag" : e.d === 1 ? "i morgen" : "";
      html += `<section class="day"><div class="day-head"><b>${DAYS[e.dt.getDay()]} ${pad(e.dt.getDate())}.${pad(e.dt.getMonth() + 1)}</b>${rel}</div>`;
    }
    const open = state.open.has(e.id);
    const who = e.actor && !e.actor.startsWith(e.venue) ? `${esc(e.venue)} / ${esc(e.actor)}` : esc(e.venue);
    html += `<div class="ev" role="button" tabindex="0" data-id="${e.id}" aria-expanded="${open}">
      <span class="img" aria-hidden="true" style="background-image:url(&quot;${e.img || thumb()}&quot;)"></span>
      <span class="time">${e.t || "––:––"}</span>
      <div><span class="title">${esc(e.title)}</span><div class="meta">${who} · ${e.cat}</div>${open ? `<div class="desc">${e.desc ? esc(e.desc) : ""}<div class="links"><a class="pill on" href="${esc(e.url)}" target="_blank" rel="noopener">til arrangementet →</a>${e.ics ? `<a class="pill" href="${esc(e.ics)}">+ legg i kalender</a>` : ""}</div></div>` : ""}</div>
    </div>`;
  });
  feed.innerHTML = html + "</section>";
}
function toggle(el) { const id = +el.dataset.id; state.open.has(id) ? state.open.delete(id) : state.open.add(id); render(); }
const feedEl = document.getElementById("feed");
feedEl.addEventListener("click", ev => { if (ev.target.closest("a")) return; const el = ev.target.closest(".ev"); if (el) toggle(el); });
feedEl.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList.contains("ev")) { ev.preventDefault(); toggle(ev.target); } });


function fitLogo() {
  const el = document.getElementById("logo"); el.style.fontSize = "13px";
  if (el.scrollWidth > el.clientWidth) el.style.fontSize = (13 * el.clientWidth / el.scrollWidth).toFixed(2) + "px";
}
addEventListener("resize", fitLogo);
document.fonts && document.fonts.ready.then(fitLogo);
fitLogo();
document.getElementById("updated").textContent = DATA.updated ? "oppdatert " + DATA.updated : "";
const nav = document.querySelector(".nav");
const setNavH = () => document.documentElement.style.setProperty("--navh", nav.offsetHeight + "px");
if (window.ResizeObserver) new ResizeObserver(setNavH).observe(nav);
setNavH();
renderOngoing();
render();
</script>
</body>
</html>
